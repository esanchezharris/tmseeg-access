name: tests

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts examples
      - name: Check formatting
        run: uv run ruff format --check src tests scripts examples
      - name: Run synthetic tests
        # TMSEEG_DATA_ROOT is unset here, so tests that need the real dataset skip.
        run: uv run pytest
